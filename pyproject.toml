[project]
name = "weekly-assistant"
version = "0.1.0"
description = "Semi-automatic weekly assistant for Evgeny reports"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
google = ["google-auth>=2.29.0", "requests>=2.32.0"]
telegram-mtproto = ["telethon>=1.34.0"]
dev = []

[project.scripts]
weekly-assistant = "weekly_assistant.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
